name: Validate prompt catalog
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm test
      - name: Validate reviewed catalog when present
        if: ${{ hashFiles('export/catalog.json') != '' }}
        run: npm run validate
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Check English and Chinese portfolio documentation
        run: python3 scripts/generate-readme.py --check
